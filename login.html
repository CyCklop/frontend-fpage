<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>login</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="shortcut icon" href="img/logo.png" type="image/x-icon">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
</head>

<body>
  <header>
    <nav class="nav-tab">
      <a href="index.html">
        <img src="img/logo.png" alt="logo">
      </a>
      <ul>
        <li><a href="#">CD'S/CASSETTES</a></li>
        <li><a href="#">VINILOS</a></li>
        <li><a href="#">TORNAMESAS</a></li>
        <li><a href="login.html">INGRESAR</a></li>
      </ul>
    </nav>
  </header>
  
  <main>
    <div class="form-container">
      <form>
        <div class="mb-3">
          <h1>Ingresar</h1>
          <label for="exampleInputEmail1" class="form-label">Correo Electronico</label>
          <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
        </div>
        <div class="mb-3">
          <label for="exampleInputPassword1" class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="exampleInputPassword1">
        </div>
        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" id="exampleCheck1">
          <label class="form-check-label" for="exampleCheck1">Mantener mi sesión activa</label>
        </div>
        <button type="submit" class="btn btn-primary">Ingresar</button>
      </form>

      <img src="img/foto-login.png" alt="foto-login">
    </div>
  </main>

  <footer>
    <div class="footer-container">
      
      <div class="footer-info">
        <h4>Información</h4>
        <ul>
          <li>¿Como comprar en BeatStore?</li>
          <li>Despachos</li>
          <li>Devoluciones</li>
        </ul>
      </div>

      <div class="footer-info">
        <h4>Nosotros</h4>
        <ul>
          <li>¿Quienes Somos?</li>
          <li>Encuentranos Aqui</li>
        </ul>
      </div>

      <img src="img/logo.png" alt="logo-foot">

    </div>
  </footer>
</body>
